name: Snapshot Squads for Gameweek

on:
  schedule:
    # Every Monday at 9:00 AM UTC (4 AM ET)
    - cron: '0 9 * * 1'
  
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  snapshot-squads:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Record squad snapshot for gameweek
        run: python backend/weekly/record_squads.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Notify on failure
        if: failure()
        run: echo "Squad snapshot failed! Check logs above for details."